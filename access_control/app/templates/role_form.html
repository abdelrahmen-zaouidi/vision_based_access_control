{% extends 'base.html' %}
{% block content %}
<div class="card">
  <div class="card-body">
    <h5 class="card-title">{{ action }} Role</h5>
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Role Name</label>
        <input class="form-control" name="role_name" value="{{ role.role_name if role else '' }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea class="form-control" name="description">{{ role.description if role else '' }}</textarea>
      </div>
      <button class="btn btn-primary">{{ action }}</button>
    </form>
  </div>
</div>
{% endblock %}
