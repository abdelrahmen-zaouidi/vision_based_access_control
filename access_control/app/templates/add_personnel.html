{% extends 'base.html' %}
{% block content %}
<div class="card">
  <div class="card-body">
    <h5 class="card-title">{% if person %}Edit Personnel{% else %}Add Personnel{% endif %}</h5>
    <form method="post" enctype="multipart/form-data">
      <div class="mb-3">
        <label class="form-label" for="full_name">Full Name</label>
        <input id="full_name" class="form-control" name="full_name" value="{{ person.full_name if person }}" required title="Full name" placeholder="Full name">
      </div>
      <div class="mb-3">
        <label class="form-label" for="role_id">Role</label>
        <select id="role_id" class="form-control" name="role_id" title="Role selection">
          {% for r in roles %}
            <option value="{{ r.id }}" {% if person and person.role_id==r.id %}selected{% endif %}>{{ r.role_name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label" for="face_image">Face Image (clear, one face){% if not person %} (required){% endif %}</label>
        <input id="face_image" type="file" class="form-control" name="face_image" {% if not person %}required{% endif %} title="Upload a clear face image">
      </div>
      {% if person %}
      <div class="mb-3 form-check">
        <input class="form-check-input" type="checkbox" id="active" name="active" value="1" {% if person.active %}checked{% endif %} title="Active status">
        <label class="form-check-label" for="active">Active</label>
      </div>
      <button type="submit" class="btn btn-primary" title="Save changes">Save</button>
      {% else %}
      <button type="submit" class="btn btn-primary" title="Add personnel">Add</button>
      {% endif %}
    </form>
  </div>
</div>
{% endblock %}
