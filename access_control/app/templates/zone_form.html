{% extends 'base.html' %}
{% block content %}
<div class="card">
  <div class="card-body">
    <h5 class="card-title">{{ action }} Zone</h5>
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Zone Name</label>
        <input class="form-control" name="zone_name" value="{{ zone.zone_name if zone else '' }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea class="form-control" name="description">{{ zone.description if zone else '' }}</textarea>
      </div>
      <button class="btn btn-primary">{{ action }}</button>
    </form>
  </div>
</div>
{% endblock %}
