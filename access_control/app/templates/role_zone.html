{% extends 'base.html' %}
{% block content %}
<div class="card">
  <div class="card-body">
    <h5 class="card-title">Role ↔ Zone Assignment</h5>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">Role</label>
        <select name="role_id" class="form-control" title="Select a role">
          {% for r in roles %}
            <option value="{{ r.id }}">{{ r.role_name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Zones (select multiple)</label>
        <select multiple name="zone_ids" class="form-control" title="Select zones">
          {% for z in zones %}
            <option value="{{ z.id }}">{{ z.zone_name }}</option>
          {% endfor %}
        </select>
      </div>
      <button type="submit" class="btn btn-primary">Save</button>
    </form>
  </div>
</div>
{% endblock %}
